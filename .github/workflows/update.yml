
name: Update San Carlo Opera Calendars

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: san-carlo-calendar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate calendars
        run: python operabook_calendar.py

      - name: Commit updated calendars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add san-carlo-opera.ics
          git add san-carlo-saturdays.ics
          git add san-carlo-ticket-sales.ics

          if ! git diff --cached --quiet; then
            git commit -m "Update San Carlo calendars"
            git push
          else
            echo "No calendar changes"
          fi
